<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Interview Learning (MIL) — Java Mastery & Technical Interview Preparation</title>
    <meta name="description" content="Enterprise Java & JVM interview preparation platform. Master JVM memory internals, OOP architecture, concurrency & synchronization, Maven build lifecycles, and 117+ technical interview questions." />
    <meta name="theme-color" content="#090a0f" />

    <!-- Site Favicon & Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="My Interview Learning (MIL)" />
    <meta property="og:description" content="Master Enterprise Java, JVM Internals, Multithreading, Maven, and 117+ Technical Interview Questions." />
    <meta property="og:image" content="/logo.svg" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Prevent theme flash script -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('mil_theme_preference') || localStorage.getItem('mjl_theme_preference');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#090a0f] text-zinc-900 dark:text-zinc-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
